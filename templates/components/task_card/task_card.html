<div class="w-full md:w-1/2 mx-auto flex items-center justify-between px-5 py-3.5 rounded-2xl border transition-all text-xs {% if task.is_completed %}bg-gray-100/50 border-transparent shadow-none{% else %}bg-white border-gray-100 shadow-[0_2px_6px_rgba(0,0,0,0.01)] hover:border-gray-200 hover:shadow-sm{% endif %}">
    <div class="flex items-center gap-3.5 min-w-0">
        <!-- One UI Rounded Selection Circle -->
        <a href="{% url 'toggle_task' task.id %}" class="h-[18px] w-[18px] rounded-full border flex-shrink-0 flex items-center justify-center transition-colors cursor-pointer {% if task.is_completed %}bg-sky-500 border-sky-500 text-white{% else %}border-gray-300 bg-transparent hover:border-sky-400{% endif %}">
            {% if task.is_completed %}
            <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            {% endif %}
        </a>
        <p class="font-medium tracking-wide truncate {% if task.is_completed %}line-through text-gray-400 font-normal{% else %}text-slate-800{% endif %}">
            {{ task.title }}
        </p>
    </div>
    
    <div class="flex items-center gap-4 flex-shrink-0 ml-4 text-[11px] font-medium">
        <span class="{% if task.is_completed %}text-gray-300{% else %}text-sky-600{% endif %}">
            {{ task.due_date|date:"M d" }}
        </span>
        
        <form method="POST" action="{% url 'delete_task' task.id %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="px-2.5 py-1 rounded-full text-red-500 bg-transparent hover:bg-red-50 transition-colors cursor-pointer">
                Delete
            </button>
        </form>
    </div>
</div>
